[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "relaygrid-restoration-lab"
version = "1.0.0"
description = "Distribution-grid outage restoration and switching analysis toolkit"
requires-python = ">=3.10"
authors = [{name = "RelayGrid Lab"}]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
relaygrid = "relaygrid.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
